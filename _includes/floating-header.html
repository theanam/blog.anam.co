<div class="floating-header">
    <div class="floating-header-logo">
        <a href="{{ '/' | relative_url }}">
            <img src="{{ site.favicon | relative_url }}" alt="{{ site.title }} icon" />
            <span>{{ site.title }}</span>
        </a>
    </div>
    <span class="floating-header-divider">&mdash;</span>
    <div class="floating-header-title">{{ page.title }}</div>
    <div class="floating-header-share">
        <div class="floating-header-share-label">Share this {% include point.html %}</div>
        <a class="floating-header-share-tw" href="https://twitter.com/share?text={{ page.title | url_encode }}&amp;url={{ page.url | absolute_url | url_encode }}"
            onclick="window.open(this.href, 'share-twitter', 'width=550,height=235');return false;">{% include twitter.html %}</a>
        <a class="floating-header-share-fb" href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}"
            onclick="window.open(this.href, 'share-facebook','width=580,height=296');return false;">{% include facebook.html %}</a>
    </div>
    <progress class="progress" value="0">
        <div class="progress-container"><span class="progress-bar"></span></div>
    </progress>
</div>
