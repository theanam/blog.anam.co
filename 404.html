---
layout: default
class: error-template
title: "404 - Page Not Found"
permalink: /404.html
sitemap: false
---
<header class="site-header outer no-cover">
    <div class="inner">
        <nav class="site-nav-center">
            <a class="site-nav-logo" href="{{ '/' | relative_url }}"><img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" /></a>
        </nav>
    </div>
</header>
<main id="site-main" class="site-main outer" role="main">
    <div class="inner">
        <section class="error-message">
            <h1 class="error-code">404</h1>
            <p class="error-description">Page not found</p>
            <a class="error-link" href="{{ '/' | relative_url }}">Go to the front page &rarr;</a>
        </section>
    </div>
</main>
<aside class="outer">
    <div class="inner">
        <div class="post-feed">
            {% for post in site.posts limit: 3 %}{% include post-card.html post=post %}{% endfor %}
        </div>
    </div>
</aside>
